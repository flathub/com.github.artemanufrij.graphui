app-id: com.github.artemanufrij.graphui
runtime: org.freedesktop.Platform
runtime-version: '24.08'
base: io.elementary.BaseApp
base-version: 'circe-24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
build-options:
  prepend-path: /usr/lib/sdk/vala/bin/
  prepend-ld-library-path: /usr/lib/sdk/vala/lib
  prepend-pkg-config-path: /usr/lib/sdk/vala/lib/pkgconfig
command: com.github.artemanufrij.graphui
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --metadata=X-DConf=migrate-path=/com/github/artemanufrij/graphui/
cleanup:
    - /share/vala
    - /share/valadoc
modules:

  - name: libgee
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz
        sha256: 189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee

  - name: gtksourceview
    buildsystem: meson
    sources:
        - type: archive
          url: https://download.gnome.org/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz
          sha256: 7ec9d18fb283d1f84a3a3eff3b7a72b09a10c9c006597b3fbabbb5958420a87d

  - name: graphui
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: archive
        url: https://github.com/artemanufrij/graphui/archive/1.1.1.tar.gz
        sha256: 8520a394bbd2072aac2db03b1c3fa54d1f32459caafa85c9bc0fa43eadbe1a80
      - type: patch
        paths:
          - patches/fix-gtksourceview.patch
          - patches/elementary-theme.patch
          - patches/appdata.patch
    post-install:
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - mv /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - find /app/share/icons/hicolor -type f -not -path "*scalable*" -not -path "*actions*" -name "*.svg" -delete
